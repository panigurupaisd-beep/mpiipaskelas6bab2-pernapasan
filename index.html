<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Napas Si Napas</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4f4f9;--card:#fff;--ink:#12303f;--pri:#1d6fa5;--onp:#fff;--cta:#f59e0b;--cti:#3b2300;--ok:#176b3a;--okb:#dff5e8;--bad:#a8231b;--badb:#fde6e3;--line:#a9d3e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e2130;--card:#173449;--ink:#ebf6fb;--pri:#6cbbe8;--onp:#0e2130;--ok:#7be0a8;--okb:#17432e;--bad:#ff9a90;--badb:#4a1f1c;--line:#2d5c78}}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;line-height:1.25;margin:.3em 0}h1{font-size:clamp(32px,6vw,52px)}h2{font-size:clamp(24px,4vw,32px)}h3{font-size:22px}
#nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--pri)}
#nav button{flex:1 0 76px;min-height:64px;border:0;border-radius:14px;background:transparent;color:var(--onp);font:700 14px Nunito,sans-serif;cursor:pointer;transition:.2s}
#nav button span{display:block;font-size:24px}#nav button.on{background:var(--card);color:var(--pri)}
main{max-width:860px;margin:0 auto;padding:16px}
.card,.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}
.btn,.opt,.chip,.slot{min-height:60px;min-width:60px;border:2px solid var(--pri);border-radius:14px;background:var(--card);color:var(--ink);font:700 18px Nunito,sans-serif;padding:8px 18px;cursor:pointer;transition:.2s ease;margin:4px}
.btn{background:var(--pri);color:var(--onp)}.cta{background:var(--cta);border-color:var(--cta);color:var(--cti)}.big{font-size:26px;min-height:72px;padding:10px 40px}
button:focus-visible{outline:4px solid var(--cta);outline-offset:2px}button:disabled{opacity:.55;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;margin:8px 0}.good,.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.wrong,.opt.bad{background:var(--badb);border-color:var(--bad);color:var(--bad)}
.opt.ok{animation:bn .4s}.opt.bad,.slot.wrong{animation:sk .35s}
@keyframes bn{50%{transform:scale(1.04)}}@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cover{text-align:center;background:linear-gradient(#bfe6f5,#e9f8ef);padding:28px 16px}.bgi{font-size:34px;letter-spacing:10px}.by{font-size:16px}
.mas{display:flex;gap:12px;align-items:center;margin:10px 0;text-align:left}.cover .mas{justify-content:center}
.mc{position:relative;flex:0 0 84px;height:84px;border-radius:50%;background:#ffc8d2;display:grid;place-items:center;font-size:48px}.mc b{position:absolute;right:-6px;bottom:-4px;font-size:28px}
.bub{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cta);transition:width .4s}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.nv{display:flex;justify-content:space-between;margin-top:14px}
.chips,.slots{display:flex;flex-wrap:wrap}.slot{min-width:150px;border-style:dashed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sim{position:relative;height:200px;margin:10px auto;max-width:260px}.chest{position:absolute;inset:0 0 40px;border:4px solid var(--pri);border-radius:40px 40px 10px 10px;display:grid;place-items:center;overflow:hidden}
.lung{font-size:70px;transition:transform .8s ease}.dia{position:absolute;left:0;right:0;bottom:0;height:18px;background:var(--cta);border-radius:12px;transition:transform .8s ease}
.tb{width:100%;border-collapse:collapse;font-size:16px}.tb th,.tb td{border:1px solid var(--line);padding:6px;text-align:center}
.tm{font:700 28px Fredoka,sans-serif;color:var(--pri)}.big2{font-size:56px;font-family:Fredoka,sans-serif;margin:0}
textarea,select{width:100%;font:18px Nunito,sans-serif;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){body{font-size:16px}.mc{flex-basis:64px;height:64px;font-size:36px}h3{font-size:20px}}
@media(min-width:1200px){body{font-size:22px}}
</style></head><body>
<nav id="nav" aria-label="Menu utama"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),A=$('#app');
let S={best:null,last:null,ref:null,v:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('napas')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('napas',JSON.stringify(S))}catch(e){}};
const P=[['home','🏠','Beranda'],['materi','📖','Materi'],['akt','🎯','Aktivitas'],['game','🎮','Game'],['latihan','📝','Latihan'],['kuis','❓','Kuis'],['hasil','🏆','Hasil'],['refleksi','💭','Refleksi'],['petunjuk','📋','Petunjuk']];
const mas=(f,t)=>`<div class="mas"><div class="mc">🫁<b>${f}</b></div><div class="bub">${t}</div></div>`;
function go(p){clearInterval(T);S.v[p]=1;sv();$('#nav').innerHTML=P.map(x=>`<button class="${x[0]==p?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');A.innerHTML='';R[p]();scrollTo(0,0)}
let T,mi=0,at=0;
const O={Hidung:'Pintu masuk udara. Rambut hidung dan lendir menyaring debu.',Faring:'Persimpangan udara dan makanan di belakang hidung dan mulut.',Laring:'Pangkal tenggorokan, tempat pita suara untuk bersuara.',Trakea:'Batang tenggorokan berbentuk pipa dengan cincin tulang rawan.',Bronkus:'Dua cabang trakea menuju paru-paru kiri dan kanan.',Bronkiolus:'Cabang halus bronkus di dalam paru-paru.','Alveolus':'Kantong udara kecil, tempat pertukaran oksigen dan karbon dioksida.',Diafragma:'Otot di bawah paru-paru yang naik turun saat kita bernapas.'};
const M=[
()=>`${mas('🤔','Coba tahan napasmu. Kuat berapa lama?')}<div class="box"><button class="btn cta" onclick="hold()">⏱ Tahan napas 10 detik</button><p class="tm" id="hm"></p></div><h3>Pertanyaan pemantik</h3><p>Mengapa kita tidak bisa menahan napas terlalu lama? Ke mana perginya udara yang kita hirup?</p>`,
()=>`${mas('😊','Ketuk nama organ untuk melihat tugasnya!')}<div class="grid">${Object.keys(O).map(k=>`<button class="btn" onclick="$('#oi').innerHTML='<b>${k}</b>: ${O[k]}'">${k}</button>`).join('')}</div><div class="box" id="oi">Pilih satu organ di atas.</div><p><b>Jalur udara:</b> hidung → faring → laring → trakea → bronkus → bronkiolus → alveolus.</p>`,
()=>`${mas('😮','Dada kita seperti balon yang mengembang dan mengempis!')}<div class="grid"><div class="box"><h3>⬆ Inspirasi</h3><p>Diafragma turun, rongga dada membesar, udara masuk.</p></div><div class="box"><h3>⬇ Ekspirasi</h3><p>Diafragma naik, rongga dada mengecil, udara keluar.</p></div></div><div class="box"><h3>Pertukaran gas di alveolus</h3><p>Oksigen (O₂) masuk ke darah. Karbon dioksida (CO₂) keluar dari darah lalu dihembuskan.</p></div>`,
()=>`${mas('🥳','Paru-paru sehat, badan kuat!')}<div class="grid"><div class="box">😷 Pakai masker saat udara berdebu atau berasap</div><div class="box">🏃 Berolahraga teratur</div><div class="box">🚭 Jauhi asap rokok</div><div class="box">🪟 Buka jendela agar udara segar</div></div><p>Tugasmu: pilih tiga kebiasaan yang akan kamu lakukan minggu ini.</p>`];
function hold(){let n=10;clearInterval(T);T=setInterval(()=>{$('#hm').textContent=n>0?n:'Selesai! Dadamu terasa butuh udara? Itu tanda tubuh perlu oksigen.';if(n--<0)clearInterval(T)},1000)}
const R={
home(){A.innerHTML=`<section class="cover card"><div class="bgi" aria-hidden="true">☁️🌳💨🌤️</div><p>IPAS · Kelas 6 · Fase C</p><h1>Petualangan Napas Si Napas</h1><h2>Sistem Pernapasan pada Manusia</h2>${mas('😊','Halo! Aku Si Napas. Yuk jelajahi tubuhmu bersamaku!')}<button class="btn cta big" onclick="go('materi')">▶ MULAI</button><p class="by">Dibuat oleh Bayu Clestiana, S.Pd</p></section>`},
materi(){clearInterval(T);A.innerHTML=`<h2>📖 Materi ${mi+1}/${M.length}</h2><div class="bar"><i style="width:${(mi+1)/M.length*100}%"></i></div><div class="card">${M[mi]()}</div><div class="nv"><button class="btn" ${mi?'':'disabled'} onclick="mi--;R.materi()">◀ Kembali</button><button class="btn cta" onclick="mi<M.length-1?(mi++,R.materi()):go('akt')">Lanjut ▶</button></div>`},
akt(){A.innerHTML=`<h2>🎯 Aktivitas</h2><div class="row"><button class="btn ${at?'':'cta'}" onclick="at=0;R.akt()">1. Susun Jalur Napas</button><button class="btn ${at?'cta':''}" onclick="at=1;R.akt()">2. Lab Maya Diafragma</button></div><div class="card" id="act"></div>`;at?a2():a1()},
game(){A.innerHTML=`<h2>🎮 Game Kebiasaan Sehat</h2>${mas('😊','Pilih: kebiasaan ini MENJAGA atau MERUSAK paru-paru? Waktumu 60 detik!')}<button class="btn cta big" onclick="gs()">▶ Main</button>`},
latihan(){A.innerHTML=`<h2>📝 Latihan</h2>${mas('😊','Salah itu tidak apa-apa. Ada petunjuk dan kamu boleh mencoba lagi!')}<button class="btn cta big" onclick="qz(LT,'lat')">▶ Mulai Latihan</button>`},
kuis(){A.innerHTML=`<h2>❓ Kuis Akhir</h2>${mas('🤔','20 soal. Jawab sendiri dengan teliti ya. Kamu pasti bisa!')}<button class="btn cta big" onclick="qz(KS,'kuis')">▶ Mulai Kuis</button>`},
hasil(){const l=S.last;if(!l){A.innerHTML=`<h2>🏆 Hasil</h2><div class="card">Belum ada hasil. Kerjakan kuis dulu.</div><button class="btn cta" onclick="go('kuis')">Ke Kuis</button>`;return}
const s=Math.round(l.sc/l.n*100),b=s>=85?'⭐ Luar Biasa!':s>=70?'👍 Hebat!':'💪 Tetap Semangat!',tp=[['Organ dan jalur udara',0,7],['Mekanisme dan pertukaran gas',7,14],['Menjaga kesehatan',14,20]],rc=tp.filter(t=>l.w.some(i=>i>=t[1]&&i<t[2]));
A.innerHTML=`<h2>🏆 Hasil Belajar</h2><div class="card" style="text-align:center"><p class="big2">${s}</p><h3>${b}</h3><p>✓ Benar: ${l.sc} · ✗ Salah: ${l.n-l.sc} · Waktu: ${Math.floor(l.t/60)}m ${l.t%60}d · Terbaik: ${S.best}</p></div><div class="card"><h3>Ringkasan</h3><p>Udara mengalir hidung → alveolus. Diafragma turun saat inspirasi. O₂ dan CO₂ bertukar di alveolus. Jaga paru-paru dengan masker, olahraga, dan udara bersih.</p><h3>Rekomendasi</h3><p>${rc.length?'Ulangi bagian: '+rc.map(t=>t[0]).join(', ')+'.':'Semua bagian sudah kuat. Coba cari tahu tentang asma dan bronkitis!'}</p></div><button class="btn" onclick="mi=0;go('materi')">📖 Ulangi Materi</button><button class="btn cta" onclick="go('refleksi')">💭 Refleksi</button>`},
refleksi(){A.innerHTML=`<h2>💭 Refleksi</h2>${mas('🤔','Ceritakan pengalaman belajarmu ya!')}<div class="card"><p><b>Perasaanmu hari ini?</b></p><div class="row" id="em">${['😀','🙂','😐','😕'].map(e=>`<button class="btn" onclick="this.parentNode.dataset.v='${e}';[...this.parentNode.children].forEach(c=>c.classList.remove('cta'));this.classList.add('cta')">${e}</button>`).join('')}</div><p><b>Bintang untuk media ini</b></p><select id="st"><option>⭐⭐⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐</option><option>⭐</option></select><p><b>Apa yang paling kamu sukai?</b></p><textarea id="r1" rows="2"></textarea><p><b>Bagian mana yang masih sulit?</b></p><select id="r2"><option>Organ dan jalur udara</option><option>Cara bernapas</option><option>Pertukaran gas</option><option>Menjaga kesehatan</option><option>Tidak ada, semua mudah</option></select><p><b>Apa yang ingin kamu pelajari lebih lanjut?</b></p><textarea id="r3" rows="2"></textarea><button class="btn cta" onclick="rf()">Kirim Refleksi</button></div><div id="pn"></div>`},
petunjuk(){A.innerHTML=`<h2>📋 Petunjuk</h2><div class="card"><ol><li>Tekan <b>MULAI</b>, lalu baca <b>Materi</b> dengan tombol Lanjut dan Kembali.</li><li>Di <b>Aktivitas</b>, ketuk atau seret organ ke urutan yang benar, lalu coba Lab Maya.</li><li>Mainkan <b>Game</b>, kerjakan <b>Latihan</b> (boleh mengulang), lalu <b>Kuis</b>.</li><li>Lihat <b>Hasil</b> dan isi <b>Refleksi</b>.</li><li>Menu di atas selalu bisa dipakai. Progresmu tersimpan otomatis.</li></ol></div>`}};
// Aktivitas 1
const OR=['Hidung','Faring','Laring','Trakea','Bronkus','Bronkiolus','Alveolus'];let sl,pl,rs,tr,msg='';
function a1(){sl=Array(7).fill(null);pl=[...OR].sort(()=>Math.random()-.5);rs=[];tr=0;msg='';a1r()}
function a1r(){$('#act').innerHTML=`<p>Ketuk atau seret organ ke urutan jalur udara (1 = pertama).</p><div class="chips">${pl.map(o=>`<button class="chip" draggable="true" ondragstart="event.dataTransfer.setData('t','${o}')" onclick="put('${o}')">${o}</button>`).join('')||'<i>Semua sudah ditempatkan.</i>'}</div><div class="slots">${sl.map((o,i)=>`<button class="slot ${rs[i]===true?'good':rs[i]===false?'wrong':''}" ondragover="event.preventDefault()" ondrop="dr(event,${i})" onclick="un(${i})">${i+1}. ${o||'…'} ${rs[i]===true?'✓':rs[i]===false?'✗':''}</button>`).join('')}</div><button class="btn cta" onclick="ck()">Periksa</button><p aria-live="polite"><b>${msg}</b></p>`}
function put(o){const i=sl.indexOf(null);if(i<0)return;sl[i]=o;pl=pl.filter(x=>x!=o);rs[i]=null;a1r()}
function dr(e,i){const o=e.dataTransfer.getData('t');if(!o)return;if(sl[i])pl.push(sl[i]);sl[i]=o;pl=pl.filter((x,k)=>x!=o||pl.indexOf(x)!=k);rs[i]=null;a1r()}
function un(i){if(sl[i]){pl.push(sl[i]);sl[i]=null;rs[i]=null;a1r()}}
function ck(){if(sl.includes(null)){msg='Isi semua urutan dulu ya.';a1r();return}tr++;rs=sl.map((o,i)=>o==OR[i]);msg=rs.every(x=>x)?`✓ Hebat! ${'⭐'.repeat(tr==1?3:tr==2?2:1)} Udara masuk dari hidung sampai ke alveolus.`:'✗ Ada yang belum tepat. Petunjuk: udara masuk lewat hidung, lalu lewat tenggorokan, makin lama saluran makin kecil. Ketuk kotak merah untuk memindahkan, lalu periksa lagi.';a1r()}
// Aktivitas 2
let seen={};
function a2(){seen={};$('#act').innerHTML=`<p>Tekan tombol dan amati perubahan tubuh. Letakkan tanganmu di dada!</p><div class="sim"><div class="chest"><div class="lung" id="lu">🫁</div></div><div class="dia" id="di"></div></div><div class="row"><button class="btn cta" onclick="br(1)">⬆ Tarik Napas</button><button class="btn" onclick="br(0)">⬇ Hembuskan</button></div><table class="tb"><tr><th>Aksi</th><th>Diafragma</th><th>Rongga dada</th><th>Udara</th></tr><tbody id="tr"></tbody></table><div id="q2"></div>`}
function br(i){seen[i]=1;$('#lu').style.transform=i?'scale(1.5)':'scale(.85)';$('#di').style.transform=i?'translateY(16px)':'translateY(-14px)';$('#tr').insertAdjacentHTML('beforeend',i?'<tr><td>Tarik napas</td><td>Turun</td><td>Membesar</td><td>Masuk</td></tr>':'<tr><td>Hembuskan</td><td>Naik</td><td>Mengecil</td><td>Keluar</td></tr>');
if(seen[0]&&seen[1])$('#q2').innerHTML=`<h3>Kesimpulanmu</h3><p>Saat diafragma turun, rongga dada ... dan udara ...</p>${['membesar, masuk','mengecil, keluar','membesar, keluar'].map((o,k)=>`<button class="opt" onclick="this.className='opt '+(${k}==0?'ok':'bad');this.textContent=(${k}==0?'✓ Benar! Itu inspirasi: ':'✗ Belum tepat, lihat tabel lagi: ')+'${o}'">${o}</button>`).join('')}`}
// Game
const HB=[['Memakai masker saat berdebu',1],['Merokok',0],['Berolahraga teratur',1],['Membakar sampah di dekat rumah',0],['Membuka jendela agar udara segar',1],['Tidur di ruang penuh asap obat nyamuk bakar',0],['Menanam pohon di sekitar rumah',1],['Membersihkan debu tanpa masker',0],['Duduk tegak saat belajar',1],['Bermain dekat knalpot motor',0]];
let gi,gsc,gt;
function gs(){gi=0;gsc=0;gt=60;clearInterval(T);T=setInterval(()=>{gt--;const e=$('#gt');if(e)e.textContent='⏱ '+gt;if(gt<=0)gend()},1000);gr()}
function gr(){if(gi>=HB.length)return gend();A.innerHTML=`<div class="row"><span class="tm" id="gt">⏱ ${gt}</span><span class="tm">⭐ ${gsc}</span></div><div class="bar"><i style="width:${gi/HB.length*100}%"></i></div><div class="card"><h3>${HB[gi][0]}</h3><div class="row"><button class="btn" onclick="gp(1)">✓ Menjaga</button><button class="btn" onclick="gp(0)">✗ Merusak</button></div><p id="gf" aria-live="polite"></p></div>`}
function gp(v){const ok=v==HB[gi][1];if(ok)gsc+=10;$('#gf').innerHTML=ok?'<b style="color:var(--ok)">✓ Benar! +10</b>':'<b style="color:var(--bad)">✗ Belum tepat. Pikirkan: apakah ini membuat udara yang dihirup lebih bersih?</b>';document.querySelectorAll('.card .btn').forEach(b=>b.disabled=true);setTimeout(()=>{gi++;gr()},1500)}
function gend(){clearInterval(T);A.innerHTML=`<div class="card" style="text-align:center">${mas(gsc>=70?'🥳':'😊','Permainan selesai!')}<p class="big2">${gsc}</p><p>${gsc>=70?'⭐ Hebat! Kamu paham kebiasaan sehat.':'💪 Semangat! Coba main lagi dan baca Materi 4.'}</p><button class="btn cta" onclick="gs()">Main Lagi</button></div>`}
// Soal
const LT=[['Udara masuk ke tubuh pertama kali lewat ...',['Alveolus','Hidung','Paru-paru'],1,'Hidung menyaring udara.','Bagian wajah yang dipakai untuk mencium bau.'],['Gas yang dibutuhkan tubuh dari udara adalah ...',['Karbon dioksida','Nitrogen','Oksigen'],2,'Oksigen dipakai sel untuk menghasilkan energi.','Gas ini kita butuhkan agar tidak sesak saat menahan napas.'],['Saat menarik napas, diafragma bergerak ...',['Turun','Naik','Diam'],0,'Diafragma turun, rongga dada membesar.','Lihat tabel Lab Maya tadi.'],['Tempat pertukaran gas adalah ...',['Trakea','Laring','Alveolus'],2,'Dinding alveolus tipis dan dekat pembuluh darah.','Kantong udara yang sangat kecil.'],['Rambut hidung dan lendir berfungsi ...',['Menyaring debu','Membuat suara','Menukar gas'],0,'Debu dan kuman tersaring di hidung.','Pikirkan fungsi hidung sebagai penjaga pintu.'],['Kebiasaan yang menjaga paru-paru ...',['Merokok','Bermain di dekat asap','Berolahraga teratur'],2,'Olahraga meningkatkan kapasitas paru-paru.','Pilih yang membuat tubuh kuat dan udara bersih.']];
